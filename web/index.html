<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tiny-raytracer: real time</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: grab; touch-action: none; }
  canvas:active { cursor: grabbing; }
  #hud { position: fixed; top: 12px; left: 12px; color: #fff; font: 13px/1.5 monospace; background: rgba(0,0,0,.45); padding: 8px 10px; border-radius: 6px; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><span id="fps">-- fps</span><br>drag to orbit · scroll to zoom</div>
<script id="fs" type="x-shader/x-fragment">#version 300 es
precision highp float;
uniform vec2 res;
uniform float time;
uniform vec3 cam;
uniform vec3 target;
out vec4 outColor;

const int N = 6;
const float AMBIENT = 0.15;
const vec3 LIGHT = normalize(vec3(-0.6, 1.0, -0.5));

vec4 sphere(int i) {
  if (i == 0) return vec4(-2.05, 1.0, 5.6, 1.0);
  if (i == 1) return vec4(0.0, 1.4, 6.3, 1.4);
  if (i == 2) return vec4(2.05, 1.0, 5.6, 1.0);
  if (i == 3) return vec4(-0.95, 0.55 + 0.35 * abs(sin(time * 1.7)), 3.9, 0.55);
  if (i == 4) return vec4(0.95, 0.55 + 0.35 * abs(sin(time * 1.7 + 1.6)), 3.9, 0.55);
  return vec4(2.2 * sin(time * 0.8), 3.2, 6.3 - 2.2 * cos(time * 0.8), 0.35);
}

vec3 color(int i) {
  if (i == 0) return vec3(1.0, 0.35, 0.3);
  if (i == 1) return vec3(0.95);
  if (i == 2) return vec3(0.35, 0.55, 1.0);
  if (i == 3) return vec3(1.0, 0.8, 0.25);
  if (i == 4) return vec3(0.35, 1.0, 0.5);
  return vec3(0.85, 0.45, 1.0);
}

float hitSphere(vec3 o, vec3 d, vec4 s) {
  vec3 oc = o - s.xyz;
  float b = dot(oc, d);
  float disc = b * b - (dot(oc, oc) - s.w * s.w);
  if (disc < 0.0) return -1.0;
  float t = -b - sqrt(disc);
  return t > 1e-3 ? t : -1.0;
}

bool trace(vec3 o, vec3 d, out float tBest, out vec3 n, out vec3 c, out float refl) {
  tBest = 1e20;
  for (int i = 0; i < N; i++) {
    vec4 s = sphere(i);
    float t = hitSphere(o, d, s);
    if (t > 0.0 && t < tBest) {
      tBest = t;
      n = normalize(o + d * t - s.xyz);
      c = color(i);
      refl = i == 1 ? 0.95 : 0.9;
    }
  }
  if (d.y < 0.0) {
    float t = -o.y / d.y;
    if (t > 1e-3 && t < tBest) {
      tBest = t;
      vec3 p = o + d * t;
      float check = mod(floor(p.x) + floor(p.z), 2.0);
      n = vec3(0.0, 1.0, 0.0);
      c = check > 0.5 ? vec3(0.85) : vec3(0.12, 0.12, 0.14);
      refl = 0.0;
    }
  }
  return tBest < 1e19;
}

bool blocked(vec3 o, vec3 d) {
  for (int i = 0; i < N; i++) {
    if (hitSphere(o, d, sphere(i)) > 0.0) return true;
  }
  return false;
}

vec3 sky(vec3 d) {
  float k = max(0.0, d.y);
  return vec3(0.08 + 0.25 * k, 0.1 + 0.35 * k, 0.2 + 0.6 * k);
}

vec3 shade(vec3 o, vec3 d) {
  vec3 result = vec3(0.0);
  vec3 throughput = vec3(1.0);
  for (int bounce = 0; bounce < 10; bounce++) {
    float t; vec3 n; vec3 c; float refl;
    if (!trace(o, d, t, n, c, refl)) {
      result += throughput * sky(d);
      break;
    }
    vec3 p = o + d * t;
    float light = AMBIENT;
    if (!blocked(p + n * 1e-3, LIGHT)) light += max(0.0, dot(n, LIGHT));
    result += throughput * c * light * (1.0 - refl);
    if (refl == 0.0) break;
    throughput *= c * refl;
    o = p + n * 1e-3;
    d = reflect(d, n);
  }
  return result;
}

void main() {
  vec3 fwd = normalize(target - cam);
  vec3 right = normalize(cross(vec3(0.0, 1.0, 0.0), fwd));
  vec3 up = cross(fwd, right);
  float fov = tan(radians(30.0));
  vec2 uv = (2.0 * gl_FragCoord.xy - res) / res.y * fov;
  vec3 d = normalize(fwd + uv.x * right + uv.y * up);
  vec3 col = shade(cam, d);
  outColor = vec4(sqrt(max(col, 0.0)), 1.0);
}
</script>
<script>
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2');
if (!gl) document.body.innerHTML = '<p style="color:#fff;font:16px sans-serif;padding:20px">WebGL2 is not available in this browser.</p>';

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}

const vs = `#version 300 es
void main() {
  vec2 p = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2);
  gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
}`;

const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, vs));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, document.getElementById('fs').textContent));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);

const u = name => gl.getUniformLocation(prog, name);
const uRes = u('res'), uTime = u('time'), uCam = u('cam'), uTarget = u('target');
const target = [0, 1.0, 5.4];
let yaw = 0, pitch = 0.22, dist = 6.5, dragging = false, lastX = 0, lastY = 0, idle = true;

canvas.addEventListener('pointerdown', e => { dragging = true; idle = false; lastX = e.clientX; lastY = e.clientY; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointerup', () => { dragging = false; });
canvas.addEventListener('pointermove', e => {
  if (!dragging) return;
  yaw -= (e.clientX - lastX) * 0.005;
  pitch = Math.min(1.2, Math.max(0.03, pitch + (e.clientY - lastY) * 0.005));
  lastX = e.clientX; lastY = e.clientY;
});
canvas.addEventListener('wheel', e => { dist = Math.min(14, Math.max(2.5, dist * (1 + e.deltaY * 0.001))); e.preventDefault(); }, { passive: false });

function resize() {
  const scale = Math.min(window.devicePixelRatio || 1, 1.5);
  canvas.width = Math.floor(innerWidth * scale);
  canvas.height = Math.floor(innerHeight * scale);
  gl.viewport(0, 0, canvas.width, canvas.height);
}
addEventListener('resize', resize);
resize();

const fpsEl = document.getElementById('fps');
let frames = 0, lastFps = performance.now();

function frame(now) {
  const t = now / 1000;
  if (idle) yaw = Math.sin(t * 0.15) * 0.6;
  const cam = [
    target[0] + dist * Math.sin(yaw) * Math.cos(pitch),
    target[1] + dist * Math.sin(pitch),
    target[2] - dist * Math.cos(yaw) * Math.cos(pitch),
  ];
  gl.uniform2f(uRes, canvas.width, canvas.height);
  gl.uniform1f(uTime, t);
  gl.uniform3fv(uCam, cam);
  gl.uniform3fv(uTarget, target);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  frames++;
  if (now - lastFps > 500) {
    fpsEl.textContent = `${Math.round(frames * 1000 / (now - lastFps))} fps · ${canvas.width}×${canvas.height}`;
    frames = 0; lastFps = now;
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
